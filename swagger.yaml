components:
    schemas:
        TaskCreate:
            type: object
            description: Corps de la requête pour créer une tâche. L'id est auto-généré et done est initialisé à false.
            required:
                - title
            properties:
                title:
                    type: string
                    maxLength: 50
                    example: Acheter du lait
                description:
                    type: string
                    nullable: true
                    maxLength: 255
                    example: 2L demi-écrémé

        TaskUpdate:
            type: object
            description: Corps de la requête pour modifier une tâche.
            required:
                - title
                - done
            properties:
                title:
                    type: string
                    maxLength: 50
                    example: Acheter du lait
                description:
                    type: string
                    nullable: true
                    maxLength: 255
                    example: 2L demi-écrémé
                done:
                    type: boolean
                    example: false

        TaskResponse:
            type: object
            description: Représentation d'une tâche retournée par l'API.
            required:
                - id
                - title
                - done
            properties:
                id:
                    type: integer
                    example: 1
                title:
                    type: string
                    example: Acheter du lait
                description:
                    type: string
                    nullable: true
                    example: 2L demi-écrémé
                done:
                    type: boolean
                    example: false

        ValidationError:
            type: object
            description: Détail d'une erreur de validation sur un champ du corps de la requête.
            required:
                - field
                - message
            properties:
                field:
                    type: string
                    example: title
                message:
                    type: string
                    example: Le titre ne doit pas dépasser 50 caractères.
